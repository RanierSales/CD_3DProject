<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Distribuição 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: cena 3D em tela cheia, com painéis flutuantes nos cantos */
  --sky:#cfdde6;
  --ink:#16212b;
  --ink-soft:#4a5a68;
  --panel:rgba(250,252,253,.9);
  --line:rgba(22,33,43,.14);
  --accent:#1f6fb5;
  --accent-ink:#ffffff;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px)}
#head{top:16px;left:16px;padding:12px 16px;max-width:min(340px,calc(100% - 32px))}
#head h1{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.1;margin:0 0 4px;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
#head p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.4}
#opts{top:16px;right:16px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#opts label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
#opts input{accent-color:var(--accent);width:16px;height:16px;margin:0}
#opts select{font:500 14px var(--font-body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 4px}
#views{left:50%;bottom:16px;transform:translateX(-50%);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:calc(100% - 32px)}
#views button{font:500 14px var(--font-body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
#views button:hover{border-color:var(--accent)}
#views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:600 12.5px var(--font-body);color:#fff;background:rgba(22,33,43,.82);padding:3px 8px;border-radius:5px;transform:translate(-50%,-50%);will-change:transform}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:rgba(22,33,43,.7)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:16px;color:var(--ink);background:var(--sky)}
#msg[hidden]{display:none}
@media (max-width:560px){
  #head{padding:10px 12px}
  #head h1{font-size:20px}
  #head p{display:none}
  #opts{top:auto;bottom:118px;right:16px}
  #views button{padding:7px 9px;font-size:13px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="head" class="panel">
  <h1>Centro de Distribuição</h1>
  <p>Arraste para girar, use a roda do mouse para aproximar e o botão direito para mover. No celular: um dedo gira, dois dedos aproximam e movem.</p>
</div>
<div id="opts" class="panel">
  <label for="optLabels"><input type="checkbox" id="optLabels" checked> Rótulos</label>
  <label for="optShadows"><input type="checkbox" id="optShadows" checked> Sombras</label>
  <label for="optSpin"><input type="checkbox" id="optSpin"> Giro automático</label>
  <label for="optRoof"><input type="checkbox" id="optRoof"> Telhado</label>
  <label for="optNight"><input type="checkbox" id="optNight"> Noite</label>
  <label for="optAnim"><input type="checkbox" id="optAnim" checked> Operação animada</label>
  <label for="optSpeed">Velocidade <select id="optSpeed"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option></select></label>
</div>
<div id="views" class="panel" role="group" aria-label="Vistas">
  <button type="button" data-view="geral" aria-pressed="true">Visão geral</button>
  <button type="button" data-view="docas" aria-pressed="false">Docas</button>
  <button type="button" data-view="armazenagem" aria-pressed="false">Armazenagem</button>
  <button type="button" data-view="camara" aria-pressed="false">Câmara fria</button>
  <button type="button" data-view="mesas" aria-pressed="false">Mesas e totem</button>
  <button type="button" data-view="sala" aria-pressed="false">Escritório</button>
  <button type="button" data-view="topo" aria-pressed="false">Vista de cima</button>
</div>
<div id="msg">Montando o modelo 3D…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="scene.js"></script>
<script>
(function(){
  var msg=document.getElementById('msg');
  function fail(t){msg.hidden=false;msg.textContent=t;}
  if(!window.THREE||!THREE.OrbitControls){fail('Não foi possível carregar a biblioteca 3D. Verifique a conexão e recarregue a página.');return;}
  if(!window.CD){fail('Os dados do modelo não carregaram. Recarregue a página.');return;}
  var T=THREE,CD=window.CD,DM=CD.dims,stage=document.getElementById('stage');
  var renderer;
  try{renderer=new T.WebGLRenderer({antialias:true});}catch(e){fail('Este navegador não conseguiu iniciar o WebGL, necessário para o modelo 3D.');return;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=T.sRGBEncoding;
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=0.86;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=T.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  var scene=new T.Scene();
  scene.background=new T.Color(0xdfe9ef);
  scene.fog=new T.Fog(0xdfe9ef,240,560);
  var camera=new T.PerspectiveCamera(35,1,0.5,900);
  var controls=new T.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.08;
  controls.maxPolarAngle=Math.PI*0.49;controls.minDistance=4;controls.maxDistance=230;
  controls.autoRotateSpeed=0.6;

  // coordenadas do modelo (x, y, z para cima) -> three (x, z, y)
  function V(x,y,z){return new T.Vector3(x,z,y);}

  var hemi=new T.HemisphereLight(0xe6f1ff,0x8f948a,0.78);scene.add(hemi);
  function skyGeo(r){
    var g=new T.SphereGeometry(r,32,16),p=g.attributes.position,c=[],k=new T.Color();
    var top=new T.Color(0x4f8cc9).convertSRGBToLinear(),hor=new T.Color(0xdfe9ef).convertSRGBToLinear(),gr=new T.Color(0x9aa093).convertSRGBToLinear();
    for(var i=0;i<p.count;i++){var hh=p.getY(i)/r;if(hh>=0)k.copy(hor).lerp(top,Math.pow(hh,0.6));else k.copy(hor).lerp(gr,Math.min(1,-hh*6));c.push(k.r,k.g,k.b);}
    g.setAttribute('color',new T.Float32BufferAttribute(c,3));return g;
  }
  var skyMat=new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false,depthWrite:false});
  var sky=new T.Mesh(skyGeo(700),skyMat);sky.position.set(29,0,8);scene.add(sky);
  try{
    var pm=new T.PMREMGenerator(renderer),es=new T.Scene();
    es.add(new T.Mesh(skyGeo(50),skyMat.clone()));
    var ball=new T.Mesh(new T.SphereGeometry(5,12,8),new T.MeshBasicMaterial({color:0xffffff}));
    ball.position.set(0.25,0.80,0.85).normalize().multiplyScalar(40);es.add(ball);
    scene.environment=pm.fromScene(es,0.03).texture;pm.dispose();hemi.intensity=0.25;
  }catch(e){}
  var sun=new T.DirectionalLight(0xfff0d8,1.55);
  var sunTarget=V(29,12,0);
  sun.position.copy(sunTarget).add(new T.Vector3(0.25,0.80,0.85).normalize().multiplyScalar(140));
  sun.target.position.copy(sunTarget);
  sun.castShadow=true;
  sun.shadow.mapSize.set(4096,4096);
  var sc=sun.shadow.camera;sc.left=-54;sc.right=54;sc.top=56;sc.bottom=-56;sc.near=20;sc.far=320;
  sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.04;
  scene.add(sun);scene.add(sun.target);

  var mats=CD.mats.map(function(m){
    var o={color:new T.Color(m.c).convertSRGBToLinear(),roughness:0.92,metalness:0};
    if(m.k==='plastic'){o.roughness=0.5;}
    else if(m.k==='gloss'){o.roughness=0.22;}
    else if(m.k==='metal'){o.roughness=0.38;o.metalness=0.6;}
    else if(m.k==='emit'){o.emissive=o.color.clone();o.emissiveIntensity=0.85;}
    else if(m.k==='glass'){o.transparent=true;o.opacity=0.35;o.roughness=0.1;}
    o.envMapIntensity=0.55;
    return new T.MeshStandardMaterial(o);
  });

  var boxGeo=new T.BoxGeometry(1,1,1),M4=new T.Matrix4(),Q=new T.Quaternion(),P=new T.Vector3(),S=new T.Vector3();
  CD.boxes.forEach(function(g){
    var f=g[1],n=f.length/6,mesh=new T.InstancedMesh(boxGeo,mats[g[0]],n);
    for(var i=0;i<n;i++){
      var x=f[i*6],y=f[i*6+1],z=f[i*6+2],w=f[i*6+3],d=f[i*6+4],h=Math.max(f[i*6+5],0.003);
      P.set(x+w/2,z+h/2,y+d/2);S.set(Math.max(w,0.003),h,Math.max(d,0.003));
      M4.compose(P,Q,S);mesh.setMatrixAt(i,M4);
    }
    mesh.instanceMatrix.needsUpdate=true;
    mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;
    scene.add(mesh);
  });
  var UP=new T.Vector3(0,1,0),QR=new T.Quaternion();
  (CD.rb||[]).forEach(function(g){
    var f=g[1],n=f.length/7,mesh=new T.InstancedMesh(boxGeo,mats[g[0]],n);
    for(var i=0;i<n;i++){
      var cx=f[i*7],cy=f[i*7+1],z=f[i*7+2],w=f[i*7+3],d=f[i*7+4],h=Math.max(f[i*7+5],0.003);
      P.set(cx,z+h/2,cy);S.set(Math.max(w,0.003),h,Math.max(d,0.003));QR.setFromAxisAngle(UP,-f[i*7+6]);
      M4.compose(P,QR,S);mesh.setMatrixAt(i,M4);
    }
    mesh.instanceMatrix.needsUpdate=true;
    mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;
    scene.add(mesh);
  });
  CD.cyl.forEach(function(c){
    var a=V(c[0],c[1],c[2]),b=V(c[3],c[4],c[5]),dir=b.clone().sub(a),len=dir.length();
    if(len<1e-4)return;
    var m=new T.Mesh(new T.CylinderGeometry(c[6],c[6],len,20),mats[c[7]]);
    m.position.copy(a).add(b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(UP,dir.normalize());
    m.castShadow=true;m.receiveShadow=true;scene.add(m);
  });
  var sphGeo=new T.SphereGeometry(1,16,12);
  CD.sph.forEach(function(s){
    var m=new T.Mesh(sphGeo,mats[s[4]]);
    m.position.copy(V(s[0],s[1],s[2]));m.scale.setScalar(s[3]);
    m.castShadow=true;scene.add(m);
  });

  var PL=CD.plan;
  function plane(x1,y1,x2,y2,z,mat){
    var g=new T.BufferGeometry();
    var pts=[[x1,y1],[x2,y1],[x2,y2],[x1,y2]],pos=[],uv=[],nor=[];
    pts.forEach(function(p){pos.push(p[0],z,p[1]);uv.push((p[0]-PL.x0)/PL.w,1-(p[1]-PL.y0)/PL.d);nor.push(0,1,0);});
    g.setAttribute('position',new T.Float32BufferAttribute(pos,3));
    g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));
    g.setAttribute('normal',new T.Float32BufferAttribute(nor,3));
    g.setIndex([0,2,1,0,3,2]);
    var m=new T.Mesh(g,mat);m.receiveShadow=true;scene.add(m);return m;
  }
  var floorMat=new T.MeshStandardMaterial({color:0xd0cec6,roughness:0.55,side:T.DoubleSide});
  var yardMat=new T.MeshStandardMaterial({color:0x58595b,roughness:0.95,side:T.DoubleSide});
  function polyTop(a,z,mat){
    var g=new T.BufferGeometry(),pos=[],uv=[],nor=[],idx=[],n=a.length/2;
    for(var i=0;i<n;i++){pos.push(a[i*2],z,a[i*2+1]);uv.push((a[i*2]-PL.x0)/PL.w,1-(a[i*2+1]-PL.y0)/PL.d);nor.push(0,1,0);}
    for(var q=1;q<n-1;q++)idx.push(0,q+1,q);
    g.setAttribute('position',new T.Float32BufferAttribute(pos,3));
    g.setAttribute('uv',new T.Float32BufferAttribute(uv,2));
    g.setAttribute('normal',new T.Float32BufferAttribute(nor,3));
    g.setIndex(idx);
    var m=new T.Mesh(g,mat);m.receiveShadow=true;scene.add(m);
  }
  if(CD.tops&&CD.tops.length){CD.tops.forEach(function(a){polyTop(a,0.004,floorMat);});}
  else plane(0,DM.YB,DM.W,DM.D,0.004,floorMat);
  plane(PL.x0,PL.y0,PL.x0+PL.w,PL.y0+PL.d,DM.YZ,yardMat);
  var groundMat=new T.MeshStandardMaterial({color:new T.Color(0xa3a99a).convertSRGBToLinear(),roughness:1});
  var ground=new T.Mesh(new T.PlaneGeometry(1400,1400),groundMat);
  ground.rotation.x=-Math.PI/2;ground.position.set(29,DM.YZ-0.04,8);ground.receiveShadow=true;scene.add(ground);
  var img=new Image();
  img.onload=function(){
    var tex=new T.Texture(img);tex.encoding=T.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();tex.needsUpdate=true;
    [floorMat,yardMat].forEach(function(m){m.map=tex;m.color.set(0xffffff);m.needsUpdate=true;});
  };
  img.src=PL.img;

  // ---------- operação animada ----------
  function build(a){
    var g=new T.Group();
    (a.b||[]).forEach(function(e){
      var f=e[1],n=f.length/6,m=new T.InstancedMesh(boxGeo,mats[e[0]],n);
      for(var i=0;i<n;i++){var x=f[i*6],y=f[i*6+1],z=f[i*6+2],w=f[i*6+3],d=f[i*6+4],hh=Math.max(f[i*6+5],0.003);P.set(x+w/2,z+hh/2,y+d/2);S.set(Math.max(w,0.003),hh,Math.max(d,0.003));M4.compose(P,Q,S);m.setMatrixAt(i,M4);}
      m.instanceMatrix.needsUpdate=true;m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;g.add(m);
    });
    (a.rb||[]).forEach(function(e){
      var f=e[1],n=f.length/7,m=new T.InstancedMesh(boxGeo,mats[e[0]],n);
      for(var i=0;i<n;i++){var hh=Math.max(f[i*7+5],0.003);P.set(f[i*7],f[i*7+2]+hh/2,f[i*7+1]);S.set(Math.max(f[i*7+3],0.003),hh,Math.max(f[i*7+4],0.003));QR.setFromAxisAngle(UP,-f[i*7+6]);M4.compose(P,QR,S);m.setMatrixAt(i,M4);}
      m.instanceMatrix.needsUpdate=true;m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;g.add(m);
    });
    (a.c||[]).forEach(function(c){
      var p0=V(c[0],c[1],c[2]),p1=V(c[3],c[4],c[5]),dir=p1.clone().sub(p0),len=dir.length();if(len<1e-4)return;
      var m=new T.Mesh(new T.CylinderGeometry(c[6],c[6],len,16),mats[c[7]]);
      m.position.copy(p0).add(p1).multiplyScalar(0.5);m.quaternion.setFromUnitVectors(UP,dir.normalize());m.castShadow=true;g.add(m);
    });
    (a.s||[]).forEach(function(s){var m=new T.Mesh(sphGeo,mats[s[4]]);m.position.copy(V(s[0],s[1],s[2]));m.scale.setScalar(s[3]);m.castShadow=true;g.add(m);});
    return g;
  }
  // ---------- cobertura (telhado verde, paredes brancas) ----------
  var AN0=CD.anim||{},cover=new T.Group(),roofParts=[],envMats=[floorMat,yardMat,groundMat],hemiDay=hemi.intensity,night=false;
  cover.visible=false;scene.add(cover);
  if(CD.covers)cover.add(build(CD.covers));
  (function(){
    var W=DM.W,YB=DM.YB,D=DM.D,WH=AN0.WH||8,RY=6.35,RZ=WH+3.4,ov=0.9;
    var white=new T.MeshStandardMaterial({color:new T.Color(0xf4f4f0).convertSRGBToLinear(),roughness:0.85,side:T.DoubleSide});
    var cv=document.createElement('canvas');cv.width=64;cv.height=8;
    var c2=cv.getContext('2d'),gr=c2.createLinearGradient(0,0,64,0);
    gr.addColorStop(0,'#1c6239');gr.addColorStop(0.5,'#3d9c60');gr.addColorStop(1,'#1c6239');c2.fillStyle=gr;c2.fillRect(0,0,64,8);
    var tx=new T.CanvasTexture(cv);tx.wrapS=tx.wrapT=T.RepeatWrapping;tx.encoding=T.sRGBEncoding;
    var roofMat=new T.MeshStandardMaterial({map:tx,roughness:0.6,metalness:0.1,side:T.DoubleSide});
    var capMat=new T.MeshStandardMaterial({color:new T.Color(0x1c6239).convertSRGBToLinear(),roughness:0.6});
    envMats.push(white,roofMat,capMat);
    function slope(y0,z0,y1,z1){
      var g=new T.BufferGeometry(),x0=-0.3-ov,x1=W+0.3+ov,len=Math.hypot(y1-y0,z1-z0);
      g.setAttribute('position',new T.Float32BufferAttribute([x0,z0,y0,x1,z0,y0,x1,z1,y1,x0,z1,y1],3));
      g.setAttribute('uv',new T.Float32BufferAttribute([0,0,(x1-x0)/0.6,0,(x1-x0)/0.6,len/4,0,len/4],2));
      g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();
      var m=new T.Mesh(g,roofMat);m.castShadow=true;m.receiveShadow=true;cover.add(m);
    }
    function boxAt(x0,x1,y0,y1,z0,z1,mat){var m=new T.Mesh(boxGeo,mat);m.position.set((x0+x1)/2,(z0+z1)/2,(y0+y1)/2);m.scale.set(x1-x0,z1-z0,y1-y0);m.castShadow=true;m.receiveShadow=true;cover.add(m);}
    var yb=YB-0.3,yf=D+0.3,sb=(RZ-WH)/(RY-yb),sf=(RZ-WH)/(yf-RY);
    slope(yb-ov,WH-sb*ov,RY,RZ);slope(yf+ov,WH-sf*ov,RY,RZ);
    boxAt(-0.3-ov,W+0.3+ov,RY-0.3,RY+0.3,RZ-0.05,RZ+0.1,capMat);
    [-0.3,W+0.3].forEach(function(xg){
      var g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute([xg,WH,yb,xg,RZ,RY,xg,WH,yf],3));g.setIndex([0,1,2]);g.computeVertexNormals();
      var m=new T.Mesh(g,white);m.castShadow=true;cover.add(m);
    });
    boxAt(W,W+0.3,yb,yf,1.0,WH,white);
    var DH=AN0.DH||3.4,DW=AN0.DW||3.6,ds=AN0.doors||[],e=0;
    boxAt(0,W+0.3,D,D+0.3,DH+0.5,WH,white);
    ds.forEach(function(d){if(d-0.25>e)boxAt(e,d-0.25,D,D+0.3,1.0,DH+0.5,white);e=d+DW+0.25;});
    if(e<W+0.3)boxAt(e,W+0.3,D,D+0.3,1.0,DH+0.5,white);
  })();
  function setRoof(on){cover.visible=on;}
  // ---------- iluminação noturna ----------
  var lampMat=new T.MeshStandardMaterial({color:0xfff6dc,emissive:new T.Color(0xffe2a0),emissiveIntensity:0.12,roughness:0.6}),lamps=[];
  (function(){
    var D=DM.D,pos=[],xs=[5,13,21,37,45,53],ys=[-5.95,-1.85,2.25,6.35,11.5,15.5],i,j;
    for(i=0;i<xs.length;i++)for(j=0;j<ys.length;j++){if(xs[i]>49&&ys[j]<-2.5)continue;pos.push([xs[i],ys[j],7.45,1.2,0.3]);}
    (AN0.doors||[]).forEach(function(d){pos.push([d+1.8,D+0.42,4.0,1.0,0.16]);});
    var m=new T.InstancedMesh(boxGeo,lampMat,pos.length);
    pos.forEach(function(p,n){P.set(p[0],p[2],p[1]);S.set(p[3],0.1,p[4]);M4.compose(P,Q,S);m.setMatrixAt(n,M4);});

        {k:'mv',x:L.strip,y:fy(o),sp:0.9},
        {k:'tn',h:PI/2,sp:2.5},{k:'mv',x:L.strip,y:PY,sp:1.1},
        {k:'wu',f:function(){if(dk.ready){dk.busy++;return true;}return false;}}
      ].concat(intoTruck(a,t,dk,function(){freePallet(a.load);a.load=null;}),[
        {k:'fc',x:L.strip,y:PY,sp:2.5},{k:'mv',x:L.strip,y:PY,sp:1.1},
        {k:'tn',h:-PI/2,sp:2.5}
      ]);
      a.place();
    }
    var RY=12.2,inb=AN.inb,outb=AN.outb;
    var R1=drop(inb[0].x,RY),R2=drop(inb[1].x,RY),E1=drop(outb[0].x,RY),E2=drop(outb[1].x,RY);
    makeReach({R:R1,E:E1,lane:10.5,xc:28.3,slots:slots(AN.slots.L)});
    makeReach({R:R2,E:E2,lane:11.15,xc:29.7,slots:slots(AN.slots.R)});
    inbound({tooth:inb[0].tooth,x:inb[0].x,R:R1,kind:'jackY'});
    inbound({tooth:inb[1].tooth,x:inb[1].x,R:R2,kind:'jackO',delay:6});
    outbound({tooth:outb[0].tooth,x:outb[0].x,E:E1,kind:'jackO'});
    outbound({tooth:outb[1].tooth,x:outb[1].x,E:E2,kind:'jackY'});
    (AN.chains||[]).forEach(function(c,i){
      var LR=lane(c.din,false),LE=lane(c.dout,true);
      unloader({tooth:c.tin,L:LR,kind:i?'jackO':'jackY',delay:1+i*5});
      checker({L:LR,isE:false,home:[LR.strip+0.6,AN.LY-0.5]});
      puller({LR:LR,LE:LE,kind:i?'jackY':'jackO'});
      checker({L:LE,isE:true,home:[LE.strip-0.6,AN.LY-0.5]});
      loader({tooth:c.tout,L:LE,kind:i?'jackO':'jackY'});
    });
    (AN.veh||[]).forEach(function(v,i){
      if(v.tooth===2)v.delay=3;else if(v.tooth===8)v.delay=35;else v.docked=35+((i*37)%10)*16;
      makeVehicle(v);
    });
  })();
  /*TESTFF*/

  var VIEWS={
    geral:{p:[49,52,92],t:[29,1,14]},
    docas:{p:[40,20,58],t:[27,0,25]},
    armazenagem:{p:[29,26,30],t:[29,2,-2]},
    camara:{p:[46,30,10],t:[53.6,1,-5.6]},
    mesas:{p:[37.5,6.5,11.5],t:[29,0.9,16.8]},
    sala:{p:[7,8,37],t:[-2.7,1.2,21.5]},
    topo:{p:[29,170,15.2],t:[29,0,15]}
  };
  var tween=null,reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(name,instant){
    var v=VIEWS[name];if(!v)return;
    var p1=new T.Vector3(v.p[0],v.p[1],v.p[2]),t1=new T.Vector3(v.t[0],v.t[1],v.t[2]);
    if(instant||reduce){camera.position.copy(p1);controls.target.copy(t1);tween=null;}
    else tween={p0:camera.position.clone(),t0:controls.target.clone(),p1:p1,t1:t1,s:performance.now(),d:1100};
    document.querySelectorAll('#views button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.view===name?'true':'false');});
  }
  document.getElementById('views').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.view);});
  controls.addEventListener('start',function(){tween=null;document.querySelectorAll('#views button').forEach(function(b){b.setAttribute('aria-pressed','false');});});

  var TAGS=[
    ['Recebimento',14,13,4.5],['Expedição',44,13,4.5],
    ['Armazenagem, bloco esquerdo',14,-1,8.5],['Armazenagem, bloco direito',40,1,8.5],
    ['Corredor central',29,-3,8],['Câmara fria',53.9,-5.6,8.6],['Mesas e totem de etiquetas',28.9,16.6,3.2],['Escritório (anexo)',-2.7,21.5,4.4],['Portaria (entrada)',64,30.8,3.4],
    ['Plataforma e docas em dente de serra',27,22.6,3.4],['Pátio de manobra',29,34.5,2]
  ];
  var labelBox=document.getElementById('labels');
  var tags=TAGS.map(function(t){var el=document.createElement('div');el.className='tag';el.textContent=t[0];labelBox.appendChild(el);return {el:el,pos:V(t[1],t[2],t[3])};});
  var showTags=true,tmp=new T.Vector3();
  document.getElementById('optLabels').addEventListener('change',function(e){showTags=e.target.checked;labelBox.style.display=showTags?'':'none';});
  document.getElementById('optShadows').addEventListener('change',function(e){sun.castShadow=e.target.checked&&!night;});
  document.getElementById('optRoof').addEventListener('change',function(e){setRoof(e.target.checked);});
  document.getElementById('optNight').addEventListener('change',function(e){setNight(e.target.checked);});
  document.getElementById('optSpin').addEventListener('change',function(e){controls.autoRotate=e.target.checked;});
  var optAnim=document.getElementById('optAnim');
  if(reduce){sim.on=false;optAnim.checked=false;}
  optAnim.addEventListener('change',function(e){sim.on=e.target.checked;});
  document.getElementById('optSpeed').addEventListener('change',function(e){sim.speed=parseFloat(e.target.value)||1;});

  var W=0,H=0;
  function resize(){
    W=stage.clientWidth||window.innerWidth;H=stage.clientHeight||window.innerHeight;
    renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
  }
  window.addEventListener('resize',resize);resize();
  go('geral',true);
  if(W<H){camera.position.set(56,84,136);}

  var lastT=0;
  function frame(now){
    var dts=Math.min((now-lastT)/1000,0.1);lastT=now;
    if(sim.on&&dts>0){var sdt=dts*sim.speed;for(var ai=0;ai<sim.agents.length;ai++)sim.agents[ai].step(sdt);}
    if(tween){
      var k=Math.min((now-tween.s)/tween.d,1),e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);
      if(k>=1)tween=null;
    }
    controls.update();
    renderer.render(scene,camera);
    if(showTags){
      for(var i=0;i<tags.length;i++){
        var g=tags[i];tmp.copy(g.pos).project(camera);
        if(tmp.z>1||tmp.z<-1){g.el.style.opacity=0;continue;}
        g.el.style.opacity=1;
        g.el.style.transform='translate(-50%,-50%) translate('+((tmp.x*0.5+0.5)*W).toFixed(1)+'px,'+((-tmp.y*0.5+0.5)*H-14).toFixed(1)+'px)';
      }
    }
    requestAnimationFrame(frame);
  }
  msg.hidden=true;
  controls.update();renderer.render(scene,camera);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
